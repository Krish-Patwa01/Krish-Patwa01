name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  # deliberately no `push` trigger — this job commits, and a push trigger
  # would re-run it on its own commit

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: regenerate stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: commit if changed
        run: |
          FILES="svg/stats-light.svg svg/stats-dark.svg svg/streak-light.svg svg/streak-dark.svg svg/langs-light.svg svg/langs-dark.svg svg/year-light.svg svg/year-dark.svg"
          [ -z "$(git status --porcelain -- $FILES)" ] && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
